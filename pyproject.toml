[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clonemate"
version = "0.1.0"
description = "Open-source Claude Code skill that builds a structured local wiki for each colleague using the Karpathy LLM-Wiki methodology."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "yeasy1003" }]
keywords = ["claude-code", "skill", "lark", "feishu", "wiki", "knowledge"]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
docx = ["python-docx>=1.1"]
pptx = ["python-pptx>=0.6"]
html = ["markdownify>=0.11", "requests>=2.31"]
all = ["pypdf>=4.0", "python-docx>=1.1", "python-pptx>=0.6", "markdownify>=0.11", "requests>=2.31"]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/yeasy1003/clonemate"

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["clonemate*"]

[tool.setuptools.package-data]
clonemate = []

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm: tests that call real LLM (manual, not in CI)",
    "e2e: end-to-end tests requiring lark-cli (manual, not in CI)",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
